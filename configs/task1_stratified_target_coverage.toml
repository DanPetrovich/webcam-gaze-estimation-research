[experiment]
name = "task1_stratified_target_coverage"
seed = 20261112
budgets = [3, 5, 9, 16]
bootstrap_replicates = 100000
candidate_fraction = 0.20
guard_fraction = 0.10
maximum_iterations = 25
tolerance = 1e-10

[slices]
central_max_deg = 10.0
mid_max_deg = 20.0
names = ["central_le_10", "mid_10_20", "peripheral_gt_20"]
quota_policy = "equal_with_remainder_to_mid_then_peripheral"

[protocol]
selector = "region_quota_plus_within_region_target_farthest_first"
calibrator = "loso_tuned_huber_residual_offset"
paired_reference = "random_loso_tuned_huber_offset"
primary_goal = "reduce_peripheral_error_without_overall_regression"
