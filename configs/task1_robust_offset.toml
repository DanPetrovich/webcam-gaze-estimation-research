[experiment]
name = "task1_robust_offset"
seed = 20261112
budgets = [1, 3, 5, 9, 16]
random_draws = 100
tuning_random_draws = 20
candidate_fraction = 0.20
guard_fraction = 0.10
bootstrap_replicates = 100000
huber_delta_degrees = [0.5, 1.0, 2.0, 3.0, 5.0, 10.0]
maximum_iterations = 25
tolerance = 1e-10

[protocol]
selectors = ["random", "quality_then_target_diversity"]
calibrator = "huber_residual_offset"
delta_selection = "leave_one_subject_out_guard_error_on_random_draws"
primary_metric = "subject_mean_angular_error_deg"
