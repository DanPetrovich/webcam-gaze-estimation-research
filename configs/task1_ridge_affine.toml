[experiment]
name = "task1_ridge_affine"
seed = 20261112
budgets = [1, 3, 5, 9, 16]
random_draws = 100
tuning_random_draws = 20
candidate_fraction = 0.20
guard_fraction = 0.10
bootstrap_replicates = 100000
angle_scale_deg = 30.0
ridge_lambdas = [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]

[protocol]
duplicate_key = "target_and_prediction_angles"
split_order = "minimum_sample_index"
selectors = ["random", "fixed_uniform"]
calibrator = "ridge_affine"
ridge_target = "identity_affine_map"
ridge_selection = "leave_one_subject_out_guard_error"
primary_metric = "subject_mean_angular_error_deg"
